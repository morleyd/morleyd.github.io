name: Dependabot auto-merge

# When Dependabot opens its weekly grouped PR, enable auto-merge so it lands
# on its own once the Deploy build passes. No manual review needed for a
# static site whose only deps are build-time tooling.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only act on PRs actually opened by Dependabot
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
